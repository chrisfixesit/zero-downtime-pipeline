name: Deploy (reusable)

# Deploys a release (sha + image digests) to one environment. Called by ci.yml
# for sandbox, by apply.yml for promotion PRs, and by rollback.yml for sandbox.
# The job runs in the GitHub Environment of the same name, which is what makes
# the OIDC subject environment:<env>, the only subject that env's deployer
# role trusts.

on:
  workflow_call:
    inputs:
      env:
        type: string
        required: true
      release:
        type: string
        required: true

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    name: Deploy to ${{ inputs.env }}
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.env }}
    concurrency:
      group: deploy-${{ inputs.env }}
      cancel-in-progress: false
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6
        with:
          role-to-assume: ${{ vars.DEPLOYER_ROLE_ARN }}
          aws-region: us-east-1
      - name: Deploy
        env:
          RELEASE: ${{ inputs.release }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          printf '%s' "$RELEASE" > release.json
          .github/scripts/deploy.sh "${{ inputs.env }}" release.json
      - name: Summary
        if: always()
        env:
          RELEASE: ${{ inputs.release }}
        run: |
          {
            echo "### ${{ inputs.env }}: $(echo "$RELEASE" | jq -r .sha | cut -c1-7)"
            echo
            echo '| Image | Digest |'
            echo '|---|---|'
            echo "$RELEASE" | jq -r '.digests | to_entries[] | "| \(.key) | `\(.value)` |"'
          } >> "$GITHUB_STEP_SUMMARY"
