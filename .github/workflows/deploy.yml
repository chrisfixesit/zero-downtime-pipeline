name: Deploy (blue/green canary)

on:
  push:
    branches: [main]
    paths: [app/**, .github/workflows/deploy.yml]
  workflow_dispatch:
    inputs:
      chaos:
        description: "Set CHAOS=1 to demo alarm-triggered auto-rollback"
        default: "0"

permissions:
  id-token: write   # OIDC — no stored AWS keys
  contents: read

env:
  AWS_REGION: us-east-1
  PROJECT: zdp

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assume deploy role via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        id: image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          IMAGE="$REGISTRY/$PROJECT:${GITHUB_SHA::12}"
          docker build \
            --build-arg VERSION="${GITHUB_SHA::12}" \
            -t "$IMAGE" app/
          docker push "$IMAGE"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

      - name: Register new task definition revision
        id: taskdef
        run: |
          aws ecs describe-task-definition \
            --task-definition "$PROJECT" \
            --query taskDefinition > current.json

          jq --arg IMAGE "${{ steps.image.outputs.image }}" \
             --arg VERSION "${GITHUB_SHA::12}" \
             --arg CHAOS "${{ github.event.inputs.chaos || '0' }}" \
             '.containerDefinitions[0].image = $IMAGE
              | .containerDefinitions[0].environment = [
                  {"name":"VERSION","value":$VERSION},
                  {"name":"CHAOS","value":$CHAOS}
                ]
              | del(.taskDefinitionArn, .revision, .status, .requiresAttributes,
                    .compatibilities, .registeredAt, .registeredBy)' \
            current.json > new.json

          ARN=$(aws ecs register-task-definition \
            --cli-input-json file://new.json \
            --query 'taskDefinition.taskDefinitionArn' --output text)
          echo "arn=$ARN" >> "$GITHUB_OUTPUT"

      - name: Create blue/green deployment
        run: |
          cat > appspec.json <<EOF
          {
            "version": 0.0,
            "Resources": [{
              "TargetService": {
                "Type": "AWS::ECS::Service",
                "Properties": {
                  "TaskDefinition": "${{ steps.taskdef.outputs.arn }}",
                  "LoadBalancerInfo": {
                    "ContainerName": "app",
                    "ContainerPort": 8080
                  }
                }
              }
            }]
          }
          EOF

          DEPLOYMENT_ID=$(aws deploy create-deployment \
            --application-name "$PROJECT" \
            --deployment-group-name "$PROJECT-dg" \
            --revision "revisionType=AppSpecContent,appSpecContent={content='$(cat appspec.json | jq -c . | sed "s/'/\\\\'/g")'}" \
            --query deploymentId --output text)
          echo "Deployment: $DEPLOYMENT_ID"

          aws deploy wait deployment-successful --deployment-id "$DEPLOYMENT_ID"
